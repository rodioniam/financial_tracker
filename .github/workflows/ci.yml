name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: fin_tracker
      TEST_DB_NAME: test_db
      HOST_NAME: localhost
      PORT: 6379
      SECRET_KEY: test_secret_key
      ALGORITHM: HS256
      MONGO_URL: mongodb://localhost:27017
    services:
      db: 
        image: postgres:17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
      redis:
        image: redis:8
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ruff
        run: ruff check .
      - name: Run pytest
        run: pytest